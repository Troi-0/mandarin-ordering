name: Validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/menu-scheduler/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/menu-scheduler
      - run: npm run check
