name: Import today's Facebook menu

on:
  schedule:
    # GitHub may drop scheduled jobs under load, especially near the start of
    # an hour. Four staggered attempts make the free scheduler more resilient.
    - cron: '7,22,37,52 8-11 * * 1-5'
      timezone: Europe/Sofia
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run Facebook, Gemini, and validation without publishing anything
        required: true
        default: true
        type: boolean
      benchmark_reference:
        description: Optional human-verified reference such as data/menus/2026-08-24.json (dry run only)
        required: false
        default: ''
        type: string
      benchmark_image_path:
        description: Optional archived source image such as test-fixtures/facebook/2026-08-24.jpg
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: menu-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Extract and verify public menu image
        id: importer
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMPORT_DRY_RUN: ${{ inputs.dry_run }}
          IMPORT_REPORT_PATH: ${{ runner.temp }}/menu-import-report.json
          IMPORT_BENCHMARK_MENU: ${{ inputs.benchmark_reference }}
          IMPORT_BENCHMARK_IMAGE: ${{ inputs.benchmark_image_path }}
        run: npm run import:facebook
      - name: Upload dry-run report
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: menu-import-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/menu-import-report.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit changed menu or review draft
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "mandarin-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-menu.json data/menus data/review
          if git diff --cached --quiet; then
            echo "No menu-data change"
          else
            git commit -m "data: update Sofia menu $(date -u +%F)"
            git push
          fi
      - name: Reconcile successfully published menu with Pages
        if: steps.importer.outcome == 'success' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run reconcile:pages
      - name: Keep rejected extraction unpublished
        if: steps.importer.outcome == 'failure'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run rejected. Check its report artifact; no repository data was changed."
          else
            echo "Import or verification failed. Any review draft was committed, but current-menu.json was not replaced."
          fi
          exit 1
