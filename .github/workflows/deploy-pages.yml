name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - data/current-menu.json
      - index.html
      - package-lock.json
      - package.json
      - public/**
      - src/**
      - tsconfig*.json
      - vite.config.ts
      - .github/workflows/deploy-pages.yml
  repository_dispatch:
    types: [menu-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
